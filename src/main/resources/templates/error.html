<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background-color: #222;
            padding: 50px 30px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        h1 {
            color: #f6c66e;
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            border: 2px solid #f6c66e;
            border-radius: 5px;
            color: #f6c66e;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #f6c66e;
            color: #000;
        }
    </style>
</head>

<body>

<div class="error-container">

    <h1>Something Went Wrong</h1>

    <p>
        An unexpected error occurred.
        Please try again.
    </p>

    <a href="/" class="back-btn">
        Back to Home
    </a>

</div>

</body>

</html>
