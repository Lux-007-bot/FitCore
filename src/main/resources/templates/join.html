```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Join Membership - FitCore</title>

  <link rel="stylesheet" href="/css/joinnow.css">
</head>

<body>

<header class="navbar">

  <div class="logo">FitCore</div>

  <a href="/membership" class="back-link">
    ← Back to Membership
  </a>

</header>


<main class="join-container">

  <h1>Join FitCore Membership</h1>

  <form action="/join" method="POST" class="join-form">

    <!-- Full Name -->
    <label for="fullname">Full Name</label>

    <input
            type="text"
            id="fullname"
            name="fullname"
            th:value="${session.loggedInUser.fullname}"
            readonly
    />


    <!-- Email -->
    <label for="email">Email</label>

    <input
            type="email"
            id="email"
            name="email"
            th:value="${session.loggedInUser.email}"
            readonly
    />


    <!-- Phone -->
    <label for="phone">Phone Number</label>

    <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
    />


    <!-- Membership Plan -->
    <label for="plan">Selected Plan</label>

    <select id="plan" name="planId" required>

      <option value="">
        -- Choose a Plan --
      </option>

      <option
              th:each="plan : ${plans}"
              th:value="${plan.id}"
              th:text="${plan.name + ' - Nrs' + plan.price}"
              th:selected="${selectedPlan != null and selectedPlan.id == plan.id}">
      </option>

    </select>


    <!-- Start Date -->
    <label for="start">Preferred Start Date</label>

    <input
            type="date"
            id="start"
            name="start"
            required
    />


    <!-- Payment Method -->
    <label>Payment Method</label>

    <div class="payment-options">

      <label>
        <input
                type="radio"
                name="payment"
                value="eSewa"
                required
        />
        eSewa
      </label>

      <label>
        <input
                type="radio"
                name="payment"
                value="Khalti"
        />
        Khalti
      </label>

      <label>
        <input
                type="radio"
                name="payment"
                value="Cash"
        />
        Cash at Counter
      </label>

      <label>
        <input
                type="radio"
                name="payment"
                value="Bank Transfer"
        />
        Bank Transfer
      </label>

    </div>


    <!-- Terms -->
    <label class="terms">

      <input
              type="checkbox"
              required
      />

      I agree to the
      <a href="#">terms and conditions</a>.

    </label>


    <!-- Submit -->
    <button
            type="submit"
            class="submit-btn">
      Confirm Membership
    </button>

  </form>

</main>


<footer class="footer">

  <p>
    &copy; 2025 FitCore. All rights reserved.
  </p>

</footer>


<script>

  // Set today's date as the minimum start date
  const startDate = document.getElementById("start");

  const today = new Date().toISOString().split("T")[0];

  startDate.min = today;

  // Pre-select plan from URL if needed
  const urlParams = new URLSearchParams(window.location.search);

  const selectedPlan = urlParams.get("plan");

  if (selectedPlan) {

    const planSelect = document.getElementById("plan");

    for (let option of planSelect.options) {

      if (
              option.text.toLowerCase().startsWith(
                      selectedPlan.toLowerCase()
              )
      ) {

        option.selected = true;

        break;
      }
    }
  }

</script>

</body>
</html>
```
