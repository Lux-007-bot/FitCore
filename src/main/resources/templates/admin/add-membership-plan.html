<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Add Membership Plan - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background-color: #222;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #f6c66e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #f6c66e;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }

        .save-button {
            background-color: #f6c66e;
            color: #111;
        }

        .save-button:hover {
            background-color: #ffd98c;
        }

        .cancel-button {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
        }

        .cancel-button:hover {
            background-color: #444;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <div class="card">

        <h1>Add Membership Plan</h1>

        <form
                action="/admin/membership-plans/new"
                method="post">

            <!-- Plan Name -->

            <div class="form-group">

                <label for="name">
                    Plan Name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Basic, Premium, Annual"
                        required>

            </div>


            <!-- Duration -->

            <div class="form-group">

                <label for="durationMonths">
                    Duration (Months)
                </label>

                <input
                        type="number"
                        id="durationMonths"
                        name="durationMonths"
                        min="1"
                        placeholder="e.g. 1"
                        required>

            </div>


            <!-- Price -->

            <div class="form-group">

                <label for="price">
                    Price (Rs.)
                </label>

                <input
                        type="number"
                        id="price"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="e.g. 1000"
                        required>

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                        id="description"
                        name="description"
                        placeholder="Describe this membership plan..."
                        required></textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button
                        type="submit"
                        class="button save-button">
                    Add Membership Plan
                </button>

                <a
                        href="/admin/membership-plans"
                        class="button cancel-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>
    ```

</div>

</body>

</html>
