<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Trainers - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #f6c66e;
        }

        .back-button {
            padding: 10px 18px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .back-button:hover {
            background-color: #333;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 20px;
            background-color: #f6c66e;
            color: #111;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .add-button:hover {
            background-color: #ffd98c;
        }

        .stats {
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stats h2 {
            margin: 0 0 5px;
            color: #f6c66e;
            font-size: 28px;
        }

        .stats p {
            margin: 0;
            color: #aaa;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            max-width: 350px;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-box input:focus {
            border-color: #f6c66e;
        }

        .table-container {
            background-color: #222;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2a2a2a;
            color: #f6c66e;
            font-weight: 600;
        }

        td {
            color: #ddd;
        }

        tr:hover {
            background-color: #292929;
        }

        .trainer-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .no-image {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #333;
            color: #888;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .trainer-name {
            color: #fff;
            font-weight: 600;
        }

        .trainer-email {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .action-button {
            display: inline-block;
            padding: 7px 12px;
            margin-right: 5px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .edit-button {
            background-color: #f6c66e;
            color: #111;
        }

        .edit-button:hover {
            background-color: #ffd98c;
        }

        .delete-button {
            background-color: #b33a3a;
            color: #fff;
        }

        .delete-button:hover {
            background-color: #d14a4a;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box input {
                max-width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Manage Trainers</h1>

        <a href="/admin/dashboard" class="back-button">
            Back to Dashboard
        </a>

    </div>

    <a href="/admin/trainers/new" class="add-button">
        + Add Trainer
    </a>

    <div class="stats">

        <h2 th:text="${trainers.size()}">0</h2>

        <p>Total Trainers</p>

    </div>

    <div class="search-box">

        <input
                type="text"
                id="trainerSearch"
                placeholder="Search trainers..."
                onkeyup="searchTrainers()">

    </div>

    <div class="table-container">

        <table id="trainersTable">

            <thead>

            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Trainer</th>
                <th>Phone</th>
                <th>Specialization</th>
                <th>Experience</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="trainer : ${trainers}">

                <td th:text="${trainer.id}">
                    1
                </td>

                <td>

                    <img
                            th:if="${trainer.imageData != null}"
                            th:src="@{/trainer/{id}/image(id=${trainer.id})}"
                            class="trainer-image"
                            alt="Trainer Image">

                    <div
                            th:if="${trainer.imageData == null}"
                            class="no-image">
                        No Image
                    </div>

                </td>

                <td>

                    <div
                            class="trainer-name"
                            th:text="${trainer.name}">
                        John Doe
                    </div>

                    <div
                            class="trainer-email"
                            th:text="${trainer.email}">
                        john@example.com
                    </div>

                </td>

                <td th:text="${trainer.phone}">
                    9800000000
                </td>

                <td th:text="${trainer.specialization}">
                    Personal Training
                </td>

                <td
                        th:text="${trainer.experienceYears + ' Year(s)'}">
                    3 Years
                </td>

                <td th:text="${trainer.description}">
                    Experienced fitness trainer
                </td>

                <td>

                    <a
                            th:href="@{/admin/trainers/{id}/edit(id=${trainer.id})}"
                            class="action-button edit-button">
                        Edit
                    </a>

                    <form
                            th:action="@{/admin/trainers/{id}/delete(id=${trainer.id})}"
                            method="post"
                            style="display: inline;">

                        <button
                                type="submit"
                                class="action-button delete-button"
                                onclick="return confirm('Are you sure you want to delete this trainer?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(trainers)}">

                <td colspan="8" class="empty">
                    No trainers found.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

    function searchTrainers() {

        const input =
            document.getElementById("trainerSearch");

        const filter =
            input.value.toLowerCase();

        const rows =
            document.querySelectorAll(
                "#trainersTable tbody tr"
            );

        rows.forEach(row => {

            const text =
                row.textContent.toLowerCase();

            if (text.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    }

</script>

</body>

</html>
