<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Memberships - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #f6c66e;
        }

        .back-button {
            padding: 10px 18px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .back-button:hover {
            background-color: #333;
        }

        .stats {
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stats h2 {
            margin: 0 0 5px;
            color: #f6c66e;
            font-size: 28px;
        }

        .stats p {
            margin: 0;
            color: #aaa;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            max-width: 350px;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-box input:focus {
            border-color: #f6c66e;
        }

        .table-container {
            background-color: #222;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2a2a2a;
            color: #f6c66e;
            font-weight: 600;
        }

        td {
            color: #ddd;
        }

        tr:hover {
            background-color: #292929;
        }

        .member-name {
            color: #fff;
            font-weight: 600;
        }

        .member-email {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .active {
            background-color: #163d24;
            color: #5ee88a;
        }

        .expired {
            background-color: #451b1b;
            color: #ff6b6b;
        }

        .pending {
            background-color: #493c18;
            color: #f6c66e;
        }

        .action-button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .edit-button {
            background-color: #f6c66e;
            color: #111;
            text-decoration: none;
            display: inline-block;
            margin-right: 6px;
        }

        .edit-button:hover {
            background-color: #ffd98c;
        }

        .delete-button {
            background-color: #b33a3a;
            color: #fff;
        }

        .delete-button:hover {
            background-color: #d14a4a;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .back-button {
                width: fit-content;
            }

            .search-box input {
                max-width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Manage Memberships</h1>

        <a href="/admin/dashboard" class="back-button">
            Back to Dashboard
        </a>

    </div>

    <div class="stats">

        <h2 th:text="${memberships.size()}">0</h2>

        <p>Total Memberships</p>

    </div>

    <div class="search-box">

        <input
                type="text"
                id="membershipSearch"
                placeholder="Search memberships..."
                onkeyup="searchMemberships">

    </div>

    <div class="table-container">

        <table id="membershipsTable">

            <thead>

            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Plan ID</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="membership : ${memberships}">

                <td th:text="${membership.id}">
                    1
                </td>

                <td>

                    <div
                            class="member-name"
                            th:each="user : ${users}"
                            th:if="${user.id == membership.userId}"
                            th:text="${user.fullname}">
                        John Doe
                    </div>

                    <div
                            class="member-email"
                            th:each="user : ${users}"
                            th:if="${user.id == membership.userId}"
                            th:text="${user.email}">
                        john@example.com
                    </div>

                </td>

                <td th:text="${membership.planId}">
                    1
                </td>

                <td th:text="${membership.startDate}">
                    2026-09-01
                </td>

                <td th:text="${membership.endDate}">
                    2026-10-01
                </td>

                <td>

                    <span
                            class="status"
                            th:classappend="${membership.status == 'ACTIVE'} ? ' active' :
                                           (${membership.status == 'EXPIRED'} ? ' expired' : ' pending')"
                            th:text="${membership.status}">
                        ACTIVE
                    </span>

                </td>

                <td>

                    <a
                            th:href="@{/admin/memberships/{id}/edit(id=${membership.id})}"
                            class="action-button edit-button">
                        Edit
                    </a>

                    <form
                            th:action="@{/admin/memberships/{id}/delete(id=${membership.id})}"
                            method="post"
                            onsubmit="return confirm('Are you sure you want to delete this membership?');"
                            style="display: inline;">

                        <button
                                type="submit"
                                class="action-button delete-button">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(memberships)}">

                <td colspan="7" class="empty">
                    No memberships found.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

    function searchMemberships() {

        const input =
            document.getElementById("membershipSearch");

        const filter =
            input.value.toLowerCase();

        const rows =
            document.querySelectorAll(
                "#membershipsTable tbody tr"
            );

        rows.forEach(row => {

            const text =
                row.textContent.toLowerCase();

            if (text.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    }

</script>

</body>

</html>
