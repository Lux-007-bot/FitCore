<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Edit Membership - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background-color: #222;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #f6c66e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #f6c66e;
        }

        .user-id {
            padding: 12px;
            background-color: #333;
            border-radius: 6px;
            color: #aaa;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }

        .save-button {
            background-color: #f6c66e;
            color: #111;
        }

        .save-button:hover {
            background-color: #ffd98c;
        }

        .cancel-button {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
        }

        .cancel-button:hover {
            background-color: #444;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <div class="card">

        <h1>Edit Membership</h1>

        <form
                th:action="@{/admin/memberships/{id}/edit(id=${membership.id})}"
                method="post">

            <!-- User ID -->
            <div class="form-group">

                <label>User ID</label>

                <div
                        class="user-id"
                        th:text="${membership.userId}">
                    1
                </div>

            </div>

            <!-- Membership Plan -->
            <div class="form-group">

                <label for="planId">
                    Membership Plan
                </label>

                <select
                        id="planId"
                        name="planId"
                        required>

                    <option
                            th:each="plan : ${plans}"
                            th:value="${plan.id}"
                            th:text="${plan.name + ' - Rs. ' + plan.price}"
                            th:selected="${plan.id == membership.planId}">
                        Basic - Rs. 1000
                    </option>

                </select>

            </div>

            <!-- Start Date -->
            <div class="form-group">

                <label for="startDate">
                    Start Date
                </label>

                <input
                        type="date"
                        id="startDate"
                        name="startDate"
                        th:value="${membership.startDate}"
                        required>

            </div>

            <!-- End Date -->
            <div class="form-group">

                <label for="endDate">
                    End Date
                </label>

                <input
                        type="date"
                        id="endDate"
                        name="endDate"
                        th:value="${membership.endDate}"
                        required>

            </div>

            <!-- Status -->
            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                        id="status"
                        name="status"
                        required>

                    <option
                            value="ACTIVE"
                            th:selected="${membership.status == 'ACTIVE'}">
                        Active
                    </option>

                    <option
                            value="EXPIRED"
                            th:selected="${membership.status == 'EXPIRED'}">
                        Expired
                    </option>

                    <option
                            value="PENDING"
                            th:selected="${membership.status == 'PENDING'}">
                        Pending
                    </option>

                </select>

            </div>

            <div class="buttons">

                <button
                        type="submit"
                        class="button save-button">
                    Save Changes
                </button>

                <a
                        href="/admin/memberships"
                        class="button cancel-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>
    ```

</div>

</body>

</html>
