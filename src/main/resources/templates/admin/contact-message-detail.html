<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Detail - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #f6c66e;
            font-size: 24px;
        }

        .back-button {
            padding: 10px 18px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .back-button:hover {
            background-color: #333;
        }

        .card {
            background-color: #222;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .unread {
            background-color: #493c18;
            color: #f6c66e;
        }

        .replied {
            background-color: #163d24;
            color: #5ee88a;
        }

        .sender-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .sender-email {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .message-label {
            color: #f6c66e;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .message-body {
            background-color: #111;
            border-radius: 8px;
            padding: 18px;
            color: #ddd;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .reply-body {
            background-color: #111;
            border: 1px solid #f6c66e;
            border-radius: 8px;
            padding: 18px;
            color: #fff;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #f6c66e;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 12px 22px;
            background-color: #f6c66e;
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #ffd98c;
        }

        .delete-form {
            margin-top: 15px;
        }

        .delete-button {
            padding: 10px 18px;
            background-color: #b33a3a;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-button:hover {
            background-color: #d14a4a;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>Message from <span th:text="${message.name}">John Doe</span></h1>
        <a href="/admin/contact-messages" class="back-button">Back to Messages</a>
    </div>

    <div class="card">

        <div class="meta-row">
            <span th:text="${message.createdAt}">2026-09-13</span>
            <span
                    class="status"
                    th:classappend="${message.status == 'REPLIED'} ? ' replied' : ' unread'"
                    th:text="${message.status}">
                UNREAD
            </span>
        </div>

        <div class="sender-name" th:text="${message.name}">John Doe</div>
        <div class="sender-email" th:text="${message.email}">john@example.com</div>

        <div class="message-label" th:text="'Subject: ' + ${message.subject}">Subject: Membership question</div>

        <div class="message-body" th:text="${message.message}">
            Original message text goes here.
        </div>

    </div>

    <div class="card" th:if="${message.reply != null}">
        <div class="message-label">Your Reply (sent)</div>
        <div class="reply-body" th:text="${message.reply}">Reply text goes here.</div>
    </div>

    <div class="card">

        <div class="message-label" th:text="${message.reply != null} ? 'Send another reply' : 'Reply to this message'">
            Reply to this message
        </div>

        <form
                th:action="@{/admin/contact-messages/{id}/reply(id=${message.id})}"
                method="post">

            <textarea
                    name="reply"
                    rows="6"
                    placeholder="Type your reply here... it will be emailed to the sender."
                    required></textarea>

            <button type="submit" class="submit-btn">Send Reply</button>

        </form>

        <form
                th:action="@{/admin/contact-messages/{id}/delete(id=${message.id})}"
                method="post"
                class="delete-form"
                onsubmit="return confirm('Delete this message permanently?');">

            <button type="submit" class="delete-button">Delete Message</button>

        </form>

    </div>

</div>

</body>

</html>
