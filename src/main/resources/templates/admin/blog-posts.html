<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Blog Posts - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: #f6c66e;
        }

        .back-button {
            padding: 10px 18px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .back-button:hover {
            background-color: #333;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 12px 20px;
            background-color: #f6c66e;
            color: #111;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .add-button:hover {
            background-color: #ffd98c;
        }

        .stats {
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .stats h2 {
            margin: 0 0 5px;
            color: #f6c66e;
            font-size: 28px;
        }

        .stats p {
            margin: 0;
            color: #aaa;
        }

        .table-container {
            background-color: #222;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2a2a2a;
            color: #f6c66e;
            font-weight: 600;
        }

        td {
            color: #ddd;
        }

        tr:hover {
            background-color: #292929;
        }

        .post-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #444;
        }

        .no-image {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #333;
            color: #888;
            border-radius: 8px;
            font-size: 11px;
            text-align: center;
        }

        .post-title {
            color: #fff;
            font-weight: 600;
        }

        .post-excerpt {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
            max-width: 350px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .action-button {
            display: inline-block;
            padding: 7px 12px;
            margin-right: 5px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .edit-button {
            background-color: #f6c66e;
            color: #111;
        }

        .edit-button:hover {
            background-color: #ffd98c;
        }

        .delete-button {
            background-color: #b33a3a;
            color: #fff;
        }

        .delete-button:hover {
            background-color: #d14a4a;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        @media (max-width: 700px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Manage Blog Posts</h1>

        <a href="/admin/dashboard" class="back-button">
            Back to Dashboard
        </a>

    </div>

    <a href="/admin/blog/new" class="add-button">
        + Add Blog Post
    </a>

    <div class="stats">

        <h2 th:text="${posts.size()}">0</h2>

        <p>Total Blog Posts</p>

    </div>

    <div class="table-container">

        <table>

            <thead>

            <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="post : ${posts}">

                <td>

                    <img
                            th:if="${post.imageData != null}"
                            th:src="@{/blog/{id}/image(id=${post.id})}"
                            class="post-image"
                            alt="Post image">

                    <div
                            th:if="${post.imageData == null}"
                            class="no-image">
                        No Image
                    </div>

                </td>

                <td>

                    <div
                            class="post-title"
                            th:text="${post.title}">
                        Blog Post Title
                    </div>

                    <div
                            class="post-excerpt"
                            th:text="${post.content}">
                        A short excerpt of the post content goes here...
                    </div>

                </td>

                <td th:text="${post.createdAt}">
                    2026-09-14
                </td>

                <td>

                    <a
                            th:href="@{/admin/blog/{id}/edit(id=${post.id})}"
                            class="action-button edit-button">
                        Edit
                    </a>

                    <form
                            th:action="@{/admin/blog/{id}/delete(id=${post.id})}"
                            method="post"
                            style="display: inline;">

                        <button
                                type="submit"
                                class="action-button delete-button"
                                onclick="return confirm('Are you sure you want to delete this post?');">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(posts)}">

                <td colspan="4" class="empty">
                    No blog posts yet.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
