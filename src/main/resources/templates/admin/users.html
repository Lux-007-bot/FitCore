<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    ```
    <title>Manage Users - FitCore</title>

    <link rel="stylesheet" href="/css/adminDashboard.css">

    <style>

        .users-page {
            padding: 35px 40px;
        }

        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            gap: 20px;
        }

        .users-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .users-header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 13px;
        }

        .user-count {
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 18px;
            text-align: center;
        }

        .user-count span {
            display: block;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-count strong {
            display: block;
            margin-top: 3px;
            color: #f6c66e;
            font-size: 22px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 9px 15px;
            border-radius: 7px;
            background: #f6c66e;
            color: #111;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e0b850;
        }

        .users-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px 12px 40px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 9px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-box input:focus {
            border-color: #f6c66e;
        }

        .search-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 14px;
        }

        .users-table-container {
            overflow-x: auto;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 13px;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 17px 20px;
            text-align: left;
            border-bottom: 1px solid #292929;
        }

        .users-table th {
            color: #f6c66e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #181818;
        }

        .users-table td {
            color: #ccc;
            font-size: 14px;
        }

        .users-table tr:last-child td {
            border-bottom: none;
        }

        .users-table tbody tr:hover {
            background: #202020;
        }

        .user-id {
            color: #777 !important;
            font-size: 12px !important;
        }

        .user-name {
            color: #fff !important;
            font-weight: 600;
        }

        .user-email {
            color: #aaa !important;
        }

        /* Active status */
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(76, 175, 80, 0.12);
            color: #7bd87f;
            font-size: 11px;
            font-weight: 600;
        }

        /* Inactive status */
        .status-badge.inactive {
            background: rgba(255, 80, 80, 0.12);
            color: #ff7777;
        }

        .action-buttons {
            display: flex;
            gap: 7px;
        }

        .action-button {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid #333;
            cursor: pointer;
            font-family: inherit;
        }

        .view-button {
            color: #ccc;
            background: #222;
        }

        .view-button:hover {
            background: #2c2c2c;
            color: #fff;
        }

        .edit-button {
            color: #111;
            background: #f6c66e;
            border-color: #f6c66e;
        }

        .edit-button:hover {
            background: #e0b850;
        }

        .delete-button {
            color: #ff7777;
            background: #261818;
            border-color: #452525;
        }

        .delete-button:hover {
            background: #351d1d;
        }

        .empty-message {
            padding: 50px !important;
            text-align: center !important;
            color: #777 !important;
        }

        @media (max-width: 700px) {

            .users-page {
                padding: 25px 18px;
            }

            .users-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .users-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .user-count {
                align-self: flex-start;
            }

        }

    </style>
    ```

</head>

<body>

<div class="main-content" style="margin-left: 0;">

    ```
    <main class="users-page">

        <a href="/admin/dashboard" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="users-header">

            <div>
                <h1>Manage Users</h1>

                <p>
                    View and manage all registered FitCore users.
                </p>
            </div>

            <div class="user-count">

                <span>Total Users</span>

                <strong th:text="${users.size()}">
                    0
                </strong>

            </div>

        </div>

        <div class="users-toolbar">

            <div class="search-box">

                <span>⌕</span>

                <input
                        type="text"
                        id="userSearch"
                        placeholder="Search users..."
                        onkeyup="searchUsers()">

            </div>

        </div>

        <div class="users-table-container">

            <table class="users-table" id="usersTable">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="user : ${users}">

                    <td class="user-id" th:text="${user.id}">
                        1
                    </td>

                    <td class="user-name" th:text="${user.fullname}">
                        John Doe
                    </td>

                    <td class="user-email" th:text="${user.email}">
                        john@example.com
                    </td>

                    <td>

                    <span
                            class="status-badge"
                            th:classappend="${!user.active ? ' inactive' : ''}"
                            th:text="${user.active ? 'Active' : 'Inactive'}">
                        Active
                    </span>

                    </td>

                    <td>

                        <div class="action-buttons">

                            <a
                                    th:href="@{/admin/users/{id}(id=${user.id})}"
                                    class="action-button view-button">
                                View
                            </a>

                            <a
                                    th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                    class="action-button edit-button">
                                Edit
                            </a>

                            <form
                                    th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                    method="post"
                                    onsubmit="return confirm('Are you sure you want to delete this user?');"
                                    style="display: inline;">

                                <button
                                        type="submit"
                                        class="action-button delete-button">
                                    Delete
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(users)}">

                    <td colspan="5" class="empty-message">
                        No registered users found.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>
    ```

</div>

<script>

    function searchUsers() {

        const input =
            document.getElementById("userSearch");

        const filter =
            input.value.toLowerCase();

        const rows =
            document.querySelectorAll(
                "#usersTable tbody tr"
            );

        rows.forEach(row => {

            const text =
                row.textContent.toLowerCase();

            if (text.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });

    }

</script>

</body>
</html>
