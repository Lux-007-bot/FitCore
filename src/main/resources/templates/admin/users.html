<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Manage Users - FitCore</title>

    <link rel="stylesheet"
          href="/css/adminDashboard.css">

    <style>

        .users-page {
            padding: 35px 40px;
        }

        .users-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            gap: 20px;
        }

        .users-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .users-header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 13px;
        }

        .user-count {
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 18px;
            text-align: center;
        }

        .user-count span {
            display: block;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-count strong {
            display: block;
            margin-top: 3px;
            color: #f6c66e;
            font-size: 22px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 9px 15px;
            border-radius: 7px;
            background: #f6c66e;
            color: #111;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #e0b850;
        }

        .users-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px 12px 40px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 9px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-box input:focus {
            border-color: #f6c66e;
        }

        .search-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 14px;
        }

        .users-table-container {
            overflow-x: auto;
            background: #1a1a1a;
            border: 1px solid #2d2d2d;
            border-radius: 13px;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 17px 20px;
            text-align: left;
            border-bottom: 1px solid #292929;
        }

        .users-table th {
            color: #f6c66e;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #181818;
        }

        .users-table td {
            color: #ccc;
            font-size: 14px;
        }

        .users-table tr:last-child td {
            border-bottom: none;
        }

        .users-table tbody tr:hover {
            background: #202020;
        }

        .user-id {
            color: #777 !important;
            font-size: 12px !important;
        }

        .user-name {
            color: #fff !important;
            font-weight: 600;
        }

        .user-email {
            color: #aaa !important;
        }

        /* Status */

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(76, 175, 80, 0.12);
            color: #7bd87f;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.inactive {
            background: rgba(255, 80, 80, 0.12);
            color: #ff7777;
        }

        /* Action Buttons */

        .action-buttons {
            display: flex;
            gap: 7px;
        }

        .action-button {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid #333;
            cursor: pointer;
            font-family: inherit;
        }

        .view-button {
            color: #ccc;
            background: #222;
        }

        .view-button:hover {
            background: #2c2c2c;
            color: #fff;
        }

        .edit-button {
            color: #111;
            background: #f6c66e;
            border-color: #f6c66e;
        }

        .edit-button:hover {
            background: #e0b850;
        }

        .delete-button {
            color: #ff7777;
            background: #261818;
            border-color: #452525;
        }

        .delete-button:hover {
            background: #351d1d;
        }

        /* Empty Message */

        .empty-message {
            padding: 50px !important;
            text-align: center !important;
            color: #777 !important;
        }

        /* Pagination */

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pagination-info {
            color: #777;
            font-size: 12px;
        }

        .pagination-info strong {
            color: #ccc;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            box-sizing: border-box;
            border: 1px solid #333;
            border-radius: 7px;
            background: #1a1a1a;
            color: #ccc;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .pagination a:hover {
            background: #2c2c2c;
            color: #fff;
            border-color: #555;
        }

        .pagination a.active {
            background: #f6c66e;
            color: #111;
            border-color: #f6c66e;
        }

        .pagination a.disabled {
            color: #555;
            background: #151515;
            border-color: #292929;
            pointer-events: none;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .users-page {
                padding: 25px 18px;
            }

            .users-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .users-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .user-count {
                align-self: flex-start;
            }

            .pagination-container {
                flex-direction: column;
                align-items: center;
            }

        }

    </style>

</head>

<body>

<div class="main-content" style="margin-left: 0;">

    <main class="users-page">

        <!-- Back to Dashboard -->

        <a href="/admin/dashboard"
           class="back-button">

            ← Back to Dashboard

        </a>


        <!-- Header -->

        <div class="users-header">

            <div>

                <h1>
                    Manage Users
                </h1>

                <p>
                    View and manage all registered FitCore users.
                </p>

            </div>


            <div class="user-count">

                <span>
                    Total Users
                </span>

                <strong th:text="${totalUsers}">
                    0
                </strong>

            </div>

        </div>


        <!-- Search -->

        <div class="users-toolbar">

            <form
                    class="search-box"
                    method="get"
                    action="/admin/users">

                <span>
                    ⌕
                </span>

                <input
                        type="text"
                        name="keyword"
                        placeholder="Search users..."
                        th:value="${keyword}">

            </form>

        </div>


        <!-- Users Table -->

        <div class="users-table-container">

            <table
                    class="users-table"
                    id="usersTable">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Full Name</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="user : ${users}">

                    <td
                            class="user-id"
                            th:text="${user.id}">
                        1
                    </td>


                    <td
                            class="user-name"
                            th:text="${user.fullname}">
                        John Doe
                    </td>


                    <td
                            class="user-email"
                            th:text="${user.email}">
                        john@example.com
                    </td>


                    <td>

                        <span
                                class="status-badge"
                                th:classappend="${!user.active ? ' inactive' : ''}"
                                th:text="${user.active ? 'Active' : 'Inactive'}">

                            Active

                        </span>

                    </td>


                    <td>

                        <div class="action-buttons">

                            <!-- View -->

                            <a
                                    th:href="@{/admin/users/{id}(id=${user.id})}"
                                    class="action-button view-button">

                                View

                            </a>


                            <!-- Edit -->

                            <a
                                    th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                    class="action-button edit-button">

                                Edit

                            </a>


                            <!-- Delete -->

                            <form
                                    th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                                    method="post"
                                    onsubmit="return confirm('Are you sure you want to delete this user?');"
                                    style="display: inline;">

                                <button
                                        type="submit"
                                        class="action-button delete-button">

                                    Delete

                                </button>

                            </form>

                        </div>

                    </td>

                </tr>


                <!-- No Users -->

                <tr th:if="${#lists.isEmpty(users)}">

                    <td
                            colspan="5"
                            class="empty-message">

                        No registered users found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- Pagination -->

        <div
                class="pagination-container"
                th:if="${totalUsers > 0}">

            <!-- Showing Information -->

            <div class="pagination-info">

                Showing

                <strong th:text="${startUser}">
                    1
                </strong>

                -

                <strong th:text="${endUser}">
                    5
                </strong>

                of

                <strong th:text="${totalUsers}">
                    5
                </strong>

                users

            </div>


            <!-- Pagination Buttons -->

            <div class="pagination">

                <!-- Previous -->

                <a
                        th:if="${currentPage > 0}"
                        th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}">

                    ←

                </a>

                <a
                        th:if="${currentPage == 0}"
                        class="disabled">

                    ←

                </a>


                <!-- Page Numbers -->

                <a
                        th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                        th:href="@{/admin/users(page=${pageNumber}, keyword=${keyword})}"
                        th:text="${pageNumber + 1}"
                        th:classappend="${pageNumber == currentPage ? ' active' : ''}">

                    1

                </a>


                <!-- Next -->

                <a
                        th:if="${currentPage < totalPages - 1}"
                        th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}">

                    →

                </a>

                <a
                        th:if="${currentPage >= totalPages - 1}"
                        class="disabled">

                    →

                </a>

            </div>

        </div>

    </main>

</div>

</body>
<script>
    const searchInput = document.querySelector('input[name="keyword"]');
    const usersTableBody = document.querySelector('#usersTable tbody');

    searchInput.addEventListener('input', async function () {

        const keyword = this.value.trim();

        try {
            const response = await fetch(
                `/admin/users/search?keyword=${encodeURIComponent(keyword)}`
            );

            if (!response.ok) {
                return;
            }

            const data = await response.json();

            usersTableBody.innerHTML = '';

            if (data.content.length === 0) {

                const row = document.createElement('tr');

                row.innerHTML = `
                    <td colspan="5" class="empty-message">
                        No registered users found.
                    </td>
                `;

                usersTableBody.appendChild(row);
                return;
            }

            data.content.forEach(user => {

                const row = document.createElement('tr');

                row.innerHTML = `
                    <td class="user-id">
                        ${user.id}
                    </td>

                    <td class="user-name">
                        ${user.fullname}
                    </td>

                    <td class="user-email">
                        ${user.email}
                    </td>

                    <td>
                        <span class="status-badge ${user.active ? '' : 'inactive'}">
                            ${user.active ? 'Active' : 'Inactive'}
                        </span>
                    </td>

                    <td>
                        <div class="action-buttons">

                            <a
                                href="/admin/users/${user.id}"
                                class="action-button view-button">
                                View
                            </a>

                            <a
                                href="/admin/users/${user.id}/edit"
                                class="action-button edit-button">
                                Edit
                            </a>

                            <form
                                action="/admin/users/${user.id}/delete"
                                method="post"
                                onsubmit="return confirm('Are you sure you want to delete this user?');"
                                style="display: inline;">

                                <button
                                    type="submit"
                                    class="action-button delete-button">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>
                `;

                usersTableBody.appendChild(row);
            });

        } catch (error) {
            console.error('User search failed:', error);
        }
    });
</script>
</html>
