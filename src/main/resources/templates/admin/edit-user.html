<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Edit User - FitCore</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background-color: #222;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f6c66e;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #111;
            color: #fff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #f6c66e;
        }

        .password-note {
            display: block;
            margin-top: 6px;
            color: #aaa;
            font-size: 13px;
        }

        .status-group {
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: #f6c66e;
            cursor: pointer;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .save-button,
        .cancel-button {
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .save-button {
            background-color: #f6c66e;
            color: #111;
        }

        .save-button:hover {
            background-color: #e5b85e;
        }

        .cancel-button {
            background-color: #444;
            color: #fff;
        }

        .cancel-button:hover {
            background-color: #555;
        }

        @media (max-width: 650px) {
            .container {
                margin: 30px 15px;
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .save-button,
            .cancel-button {
                text-align: center;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <h1>Edit User</h1>

    <form th:action="@{/admin/users/{id}/edit(id=${user.id})}"
          method="post">

        <div class="form-group">
            <label for="fullname">Full Name</label>

            <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    th:value="${user.fullname}"
                    required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    th:value="${user.email}"
                    required>
        </div>

        <div class="form-group">
            <label for="password">New Password</label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Leave blank to keep current password">

            <span class="password-note">
            Leave this field blank if you don't want to change the password.
        </span>
        </div>

        <div class="status-group">

            <label>Status</label>

            <label class="checkbox-container">

                <input
                        type="hidden"
                        name="active"
                        value="false">

                <input
                        type="checkbox"
                        id="active"
                        name="active"
                        value="true"
                        th:checked="${user.active}">

                <span>Active User</span>

            </label>

        </div>

        <div class="form-actions">

            <button
                    type="submit"
                    class="save-button">
                Save Changes
            </button>

            <a
                    href="/admin/users"
                    class="cancel-button">
                Cancel
            </a>

        </div>

    </form>
    ```

</div>

</body>
</html>
